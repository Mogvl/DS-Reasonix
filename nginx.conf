# nginx frontend for DS-Reasonix.
# Listens on the host frontend port (default 7551) and reverse-proxies the
# Reasonix serve backend (container service "reasonix", port 7552).
#
# SSE (/events) must not be buffered; long-lived connections need a long
# read timeout. No websocket upgrade headers are required (serve is HTTP+SSE).

upstream reasonix_backend {
    server reasonix:7552;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # Strip nginx's own access log noise for /events SSE keepalives.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://reasonix_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Required for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_connect_timeout 10s;
    }
}
